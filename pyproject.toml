[project]
name = "entirius-py-synerise-sdk"
version = "2.0.0"
description = "Synerise CDP REST API SDK"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "requests>=2.28.1",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/entirius/entirius-py-synerise-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synerise_sdk"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Legacy SDK migrated 1:1 — deferred cleanup:
"src/synerise_sdk/synerise_sdk.py" = ["S113"]           # requests without timeout
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["synerise_sdk"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
